schema_version: "1"
pack:
  version: "1"
  name: realfix_pilot_v1
case:
  id: more_itertools_windowed_zero_size_001
  title: windowed() accepts a zero size and yields one empty tuple
  category: input-validation
  severity: medium
  stack: [python]
  description: >
    windowed() rejected only negative sizes; a size of zero fell through to a branch
    that yielded a single empty tuple and returned, instead of being rejected as an
    invalid window size.
source_paths: [more_itertools]
tests_root: tests
ground_truth:
  bugs:
    - id: bug-1
      summary: >
        The size guard rejected only negative values and special-cased a size of zero
        by yielding one empty tuple and returning, so a zero size produced output
        rather than raising. A size of zero must be rejected like a negative size.
      files:
        - path: more_itertools/more.py
          line_ranges:
            - start: 1048
              end: 1052
      concepts: ["zero-length window", "argument domain check"]
      must_mention: ["nonpositive size"]
      acceptable_fix_keywords: ["raise on zero", "positive size"]
execution:
  run_tests: true
  test_command: "pytest tests/test_more.py -q"
  timeout_seconds: 120
  docker_image: realfix-pilot-batch-01:1
validation:
  patch_required: true
  tests_required: true
