defect_evidence: 'PR #1248 ("Fix dependency group malformed parse caching"), which references
  issue #1239, reports that resolving a malformed dependency group stored the parsed result on
  the resolver and returned it again on later lookups, so repeated resolutions kept returning
  the broken result instead of re-reporting the error, and that a non-string include-group value
  was accepted instead of rejected. The fix rejects non-string include values and refrains from
  storing parsed groups when errors were collected.

  '
