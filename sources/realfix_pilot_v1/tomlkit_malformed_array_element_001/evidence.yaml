defect_evidence: >
  PR #527 ("raise on malformed array element instead of dropping it") gives the repro
  `a = [{1]` / `a = [1, {2]` (an inline table that never reaches its '=') and explains
  that _parse_array caught the element's UnexpectedCharError and dropped it, leaving the
  cursor on ']' and producing a wrong array instead of surfacing the error. The fix lets
  the parse error propagate. No separate issue was filed; the PR establishes the defect.
